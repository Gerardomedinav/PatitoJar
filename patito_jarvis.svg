<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="jarvis-duck">
  <defs>
    <!-- Gradiente Holográfico Estilo Stark -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    
    <!-- Brillo de Neón -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- CAPA 1: Interfaz Circular de Fondo -->
  <g id="hud-bg" stroke="url(#cyber-cyan)" stroke-width="1.5" fill="none" opacity="0.5">
    <circle cx="100" cy="110" r="75" stroke-dasharray="10 15" />
    <circle cx="100" cy="110" r="65" stroke-dasharray="40 10 5 10" />
  </g>

  <!-- CAPA 2: EL PATITO (Vectores Ciber Jarvis) -->
  <g id="duck-body">
    <!-- Base de datos / Conexión inferior -->
    <path id="connection-beam" d="M70,165 Q100,155 130,165" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8" filter="url(#neon-glow)" />

    <!-- Cuerpo Principal -->
    <path id="torso" d="M60,110 C45,110 35,125 45,145 C55,165 115,165 145,150 C165,140 160,120 140,120 C120,120 110,130 95,130 C80,130 75,110 60,110 Z" fill="rgba(10, 20, 45, 0.6)" stroke="url(#cyber-cyan)" stroke-width="3" filter="url(#neon-glow)" />
    
    <!-- Cabeza -->
    <circle id="head" cx="70" cy="85" r="28" fill="rgba(10, 20, 45, 0.7)" stroke="url(#cyber-cyan)" stroke-width="3" filter="url(#neon-glow)" />
    
    <!-- Ala Holográfica -->
    <path id="wing" d="M85,125 C70,125 65,135 75,145 C85,155 115,145 110,135 C105,125 95,125 85,125 Z" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="2" opacity="0.9" />

    <!-- Pico (Estilo visera/casco de Iron Man) -->
    <path id="beak" d="M44,82 C32,82 26,88 28,94 C32,100 46,98 50,92 Z" fill="rgba(255, 170, 0, 0.4)" stroke="#ffaa00" stroke-width="2.5" filter="url(#neon-glow)" />
    
    <!-- Ojo Cyber J.A.R.V.I.S. -->
    <g id="cyber-eye">
      <circle cx="56" cy="80" r="5" fill="none" stroke="#00f0ff" stroke-width="1.5" />
      <circle cx="56" cy="80" r="2" fill="#00f0ff" />
      <!-- Línea de escaneo del ojo -->
      <line x1="48" y1="73" x2="64" y2="73" stroke="#00f0ff" stroke-width="1" opacity="0.8" />
    </g>

    <!-- Detalles de nodos del sistema (Puntos en la cabeza) -->
    <path class="hud-line" d="M70,52 A33,33 0 0,1 98,75" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7" stroke-dasharray="4 4" />
    <circle cx="85" cy="56" r="2.5" fill="#00f0ff" opacity="0.9" />
  </g>
</svg>
