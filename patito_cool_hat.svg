<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="jarvis-cool-duck">
  <defs>
    <!-- Gradiente Cuerpo Patito -->
    <linearGradient id="duck-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <!-- Gradiente Gorra Cyber -->
    <linearGradient id="cap-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#990033" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Brillo Neón -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- CAPA PRINCIPAL (CUERPO, CABEZA, GORRA, LENTES, PICO SUPERIOR) -->
  <g id="duck-base">
    <!-- Cuerpo del pato -->
    <path id="body-main" d="M 50,110 C 35,115 30,135 45,155 C 60,175 130,175 155,150 C 170,135 165,115 140,120 C 115,125 105,130 90,125 C 75,120 65,110 50,110 Z" fill="url(#duck-yellow)" stroke="#d47a00" stroke-width="2.5" />
    
    <!-- Ala -->
    <path id="wing-main" d="M 85,130 C 70,130 65,145 80,155 C 95,165 125,150 115,138 C 105,128 95,130 85,130 Z" fill="#ffaa00" stroke="#cc6600" stroke-width="2" />

    <!-- Cabeza -->
    <circle id="head-main" cx="80" cy="85" r="32" fill="url(#duck-yellow)" stroke="#d47a00" stroke-width="2.5" />

    <!-- Gorra de Béisbol en la Cabeza -->
    <!-- Visera (Visor) -->
    <path id="cap-visor" d="M 35,68 Q 65,60 95,68 C 90,62 60,54 35,68 Z" fill="#1a1a2e" stroke="#00f0ff" stroke-width="2" filter="url(#neon-glow)" />
    <!-- Corona de la Gorra -->
    <path id="cap-crown" d="M 55,56 C 55,36 78,32 102,46 C 112,54 112,68 110,72 C 85,60 65,60 55,56 Z" fill="url(#cap-red)" stroke="#ff0055" stroke-width="2" />
    <!-- Botón superior de la gorra -->
    <circle cx="78" cy="36" r="4" fill="#00f0ff" />
    <!-- Insignia Cyber en la gorra -->
    <polygon points="78,42 83,50 73,50" fill="#00f0ff" />

    <!-- Lentes de Sol Cool (Sunglasses) -->
    <path id="sunglasses" d="M 45,72 L 78,72 L 76,88 L 48,88 Z" fill="#0a0a14" stroke="#00f0ff" stroke-width="2" filter="url(#neon-glow)" />
    <!-- Puente de lentes -->
    <rect x="76" y="75" width="8" height="3" fill="#00f0ff" />
    <!-- Lente derecho -->
    <path d="M 84,72 L 102,72 L 98,86 L 84,86 Z" fill="#0a0a14" stroke="#00f0ff" stroke-width="2" filter="url(#neon-glow)" />
    <!-- Reflejo Cyan Lentes -->
    <polygon points="48,74 65,74 54,84 48,84" fill="rgba(0,240,255,0.45)" />
    <polygon points="86,74 98,74 92,84 86,84" fill="rgba(0,240,255,0.45)" />

    <!-- Pico Superior -->
    <path id="beak-top" d="M 36,88 Q 20,88 18,95 Q 26,99 48,97 L 52,91 Z" fill="#ff7700" stroke="#cc4400" stroke-width="2" />
  </g>

  <!-- CAPA PICO INFERIOR (LOWER BEAK - ANIMADO AL HABLAR) -->
  <g id="duck-lower-beak">
    <!-- Pico Inferior -->
    <path id="beak-bottom" d="M 22,96 Q 30,105 48,100 L 50,95 Q 32,97 22,96 Z" fill="#ff5500" stroke="#cc3300" stroke-width="2" />
    <!-- Detalle interior de la boca -->
    <path d="M 26,97 Q 34,101 44,98" fill="none" stroke="#990000" stroke-width="1.5" />
  </g>
</svg>
